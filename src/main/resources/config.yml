####################
# Spawner Cleaning #
####################

# Any spawner in the specified worlds that is NOT one of the whitelisted types will be removed on chunk load automatically.

spawner-worlds:
  - world_earth
spawner-whitelist:
  - CHICKEN
  - COW
  - SHEEP
  - PIG
  - RABBIT
  - ZOMBIE
  - SKELETON
  - SPIDER
  - GUARDIAN

###########
# Portals #
###########

# This section covers behaviours related to portals

nether-portals:
  # List of worlds for the plugin to deny Nether portal creation.
  blacklisted-worlds:
    - world_earth

portal-mapping:
  # Groups of linked overworlds and corresponding dimensions. Multiple groups are supported, but they must each have a defined overworld, nether, and end.
  world_resource:
    nether: world_nether
    end: world_the_end

spawn-portal:
# Settings for the portal at spawn.
  world: "world"
  corner1:
    x: 1106
    y: 45
    z: 997
  corner2:
    x: 1111
    y: 38
    z: 997
   # Command is ran from console, so only use console compatible commands.
  # Ensure the {player} variable is used.
  command: "pa open warps {player}"

####################
# Void Protections #
####################

# Settings for void protection.

void-protections:
  # List of worlds for the plugin to function in. Leave empty to disable.
  whitelisted-worlds:
    - world
  # What y level to protect under, include one decimal space (Default: -64.0).
  void-threshold: -64.0

####################
# Random teleport  #
####################

# Settings for the /rtp command.

ul-rtp:
  use-economy: true
  max-attempts: 20
  cooldown: 5

  # List of worlds with rtp support. Missing worlds have rtp disabled automatically.
  worlds:
    world_earth:
      cost: 0
      zones:
        europe:
          min-x: 720
          max-x: 4000
          min-z: -11000
          max-z: -9200
