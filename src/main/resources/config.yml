####################
#    Head Drops    #
####################

# Requires the HeadDatabase plugin by Arcaniax: https://www.spigotmc.org/resources/head-database.14280/

# Controls head drop upgrades when mobs or players are killed.
head-drops:
  enabled: true

  # Adds a flat percentage to the drop chance per level of looting on the killer's weapon.
  # EXAMPLE: 1.0 = +1% per Looting level. Set to 0.0 to disable.
  looting-bonus: 1.0

  # Disable head drops from spawner mobs?
  prevent-spawner-drops: true

  # Permissions required by the killer to trigger head drops.
  permissions:
    hostile: "united.utils.heads.hostile"
    passive: "united.utils.heads.passive"
    player: "united.utils.heads.player"

  # Player head drop settings.
  player:
    chance: 5.0

  # Hostile mob definitions.
